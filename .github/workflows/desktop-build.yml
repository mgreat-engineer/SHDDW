name: Build Shadow Helper

on:
  workflow_dispatch:
  push:
    tags: ["helper-v*"]
    paths: ["desktop/**", "backend/shadow_browser.py", ".github/workflows/desktop-build.yml"]
    branches: ["main"]

env:
  HELPER_VERSION: "1.0.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac-apple-silicon
          - os: macos-15-intel
            name: mac-intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Bundle app
        shell: bash
        run: |
          cp ../backend/shadow_browser.py shadow_helper/
          pyinstaller --noconfirm --windowed --name ShadowHelper \
            --paths shadow_helper --collect-all playwright --hidden-import openpyxl \
            shadow_helper/main.py
      - name: Windows installer
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows.iss
      - name: Mac disk image
        if: startsWith(matrix.name, 'mac')
        run: |
          mkdir -p dist-installer
          hdiutil create -volname "Shadow Helper" -srcfolder dist/ShadowHelper.app -ov -format UDZO dist-installer/ShadowHelper-${{ matrix.name }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowHelper-${{ matrix.name }}
          path: desktop/dist-installer/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('helper-build-{0}', github.run_number) }}
          name: Shadow Helper ${{ env.HELPER_VERSION }} (build ${{ github.run_number }})
          files: out/**/*
          body: |
            Install Shadow Helper, open it, and paste the connection code from Shadow → Laptop panel.
            Requires Google Chrome. Windows may show "Windows protected your PC" (click More info → Run anyway);
            on Mac, right-click the app → Open the first time. These builds are not code-signed yet.
